apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geaflow-operator.fullname" . }}
  labels:
    {{- include "geaflow-operator.labels" . | nindent 4 }}
spec:
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "geaflow-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "geaflow-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "geaflow-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must identify an image built with operator web authentication" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.httpPort }}
              protocol: TCP
          {{- if and (index .Values "operatorHealth") (index .Values.operatorHealth "livenessProbe") }}
          livenessProbe:
            {{- toYaml .Values.operatorHealth.livenessProbe | nindent 12 }}
            httpGet:
              path: /health
              port: http
          {{- end }}
          {{- if and (index .Values "operatorHealth") (index .Values.operatorHealth "startupProbe") }}
          startupProbe:
            {{- toYaml .Values.operatorHealth.startupProbe | nindent 12 }}
            httpGet:
              path: /health
              port: http
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: IS_LOCAL_MODE
              value: "false"
            - name: HTTP_SERVER_PORT
              value: "{{ .Values.container.httpPort }}"
            - name: GEAFLOW_OPERATOR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "webSecurity.existingSecret must reference a Secret containing the admin token" .Values.webSecurity.existingSecret | quote }}
                  key: {{ required "webSecurity.adminTokenKey must not be empty" .Values.webSecurity.adminTokenKey | quote }}
            - name: GEAFLOW_OPERATOR_VIEWER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webSecurity.existingSecret | quote }}
                  key: {{ required "webSecurity.viewerTokenKey must not be empty" .Values.webSecurity.viewerTokenKey | quote }}
                  optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
